<text x="609" y="568" font-size="17" class="object" text-anchor="start">c1 : ReversiPlaceCommand</text>
<path d="M595 581 H970" stroke="#94a3b8"/>
<text x="609" y="606" font-size="16" class="" text-anchor="start">Actor = p1; At = (3,4)</text>
<text x="609" y="630" font-size="16" class="" text-anchor="start">2 retained CellChanges</text>
<rect x="1010" y="540" width="390" height="115" fill="#f8fafc" stroke="#64748b" stroke-width="1.3" />
