<text x="609" y="780" font-size="16" class="" text-anchor="start">2 retained CellChanges</text>
<rect x="1010" y="690" width="390" height="115" fill="#f8fafc" stroke="#64748b" stroke-width="1.3" />
<text x="1024" y="718" font-size="17" class="object" text-anchor="start">c4 : ReversiPlaceCommand</text>
