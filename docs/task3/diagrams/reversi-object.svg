<path d="M1145 926 H1405" stroke="#94a3b8"/>
<text x="1159" y="951" font-size="16" class="" text-anchor="start">At = (5,4)</text>
<text x="1159" y="975" font-size="16" class="" text-anchor="start">Before = Piece(p1, Disk)</text>
<text x="1159" y="999" font-size="16" class="" text-anchor="start">After = Piece(p2, Disk)</text>
<polyline points="1205,805 1205,851 715,851 715,885" class="edge "/>
<polyline points="1205,851 995,851 995,885" class="edge "/>
<polyline points="1205,851 1275,851 1275,885" class="edge "/>
<text x="590" y="843" font-size="16" class="" text-anchor="start">Retained before/after values reverse both captured disks on undo</text>
<text x="50" y="1045" font-size="16" class="" text-anchor="start">Underlined names are runtime instances. / marks a derived property. Empty lists are actual empty history/inventory collections.</text>
<text x="50" y="1073" font-size="16" class="" text-anchor="start">Piece(p1/p2, Disk) denotes an immutable Piece whose Owner references that player; the board does not store X/O characters.</text>
