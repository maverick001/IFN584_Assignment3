<text x="879" y="975" font-size="16" class="" text-anchor="start">Before = Piece(p1, Disk)</text>
<text x="879" y="999" font-size="16" class="" text-anchor="start">After = Piece(p2, Disk)</text>
<rect x="1145" y="885" width="260" height="130" fill="#f8fafc" stroke="#64748b" stroke-width="1.3" />
