<text x="599" y="975" font-size="16" class="" text-anchor="start">Before = null</text>
<text x="599" y="999" font-size="16" class="" text-anchor="start">After = Piece(p2, Disk)</text>
<rect x="865" y="885" width="260" height="130" fill="#f8fafc" stroke="#64748b" stroke-width="1.3" />
