<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="1860" viewBox="0 0 1640 1860">
<title>Save and load sequence diagram using the Task 3 repository</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#152238}.mono{font-family:Consolas,monospace}.object{font-weight:bold;text-decoration:underline}.edge{fill:none;stroke:#334155;stroke-width:1.6;marker-end:url(#arrow)}.dash{stroke-dasharray:6 5}</style>
<rect width="1640" height="1860" fill="white"/>
<text x="35" y="35" font-size="26" class="" text-anchor="start">Save and load sequence diagram</text>
<text x="35" y="61" font-size="17" class="" text-anchor="start">Concrete workflow: JSON validation, factory reconstruction, command replay and state verification</text>
<rect x="22" y="87" width="176" height="63" fill="#f8fafc" stroke="#64748b" stroke-width="1.3" />
<text x="110" y="113" font-size="16" class="" text-anchor="middle">menu :</text>
<text x="110" y="137" font-size="16" class="" text-anchor="middle">MainMenu</text>
<path d="M110 150 V1758" stroke="#94a3b8" stroke-dasharray="6 6"/>
<rect x="217" y="87" width="176" height="63" fill="#f8fafc" stroke="#64748b" stroke-width="1.3" />
<text x="305" y="113" font-size="16" class="" text-anchor="middle">game :</text>
<text x="305" y="137" font-size="16" class="" text-anchor="middle">Game</text>
<path d="M305 150 V1758" stroke="#94a3b8" stroke-dasharray="6 6"/>
<rect x="432" y="87" width="176" height="63" fill="#f8fafc" stroke="#64748b" stroke-width="1.3" />
<text x="520" y="113" font-size="16" class="" text-anchor="middle">repository :</text>
<text x="520" y="137" font-size="16" class="" text-anchor="middle">JsonGameRepository</text>
<path d="M520 150 V1758" stroke="#94a3b8" stroke-dasharray="6 6"/>
<rect x="642" y="87" width="176" height="63" fill="#f8fafc" stroke="#64748b" stroke-width="1.3" />
<text x="730" y="113" font-size="16" class="" text-anchor="middle">File system</text>
<path d="M730 150 V1758" stroke="#94a3b8" stroke-dasharray="6 6"/>
<rect x="842" y="87" width="176" height="63" fill="#f8fafc" stroke="#64748b" stroke-width="1.3" />
<text x="930" y="113" font-size="16" class="" text-anchor="middle">catalog :</text>
<text x="930" y="137" font-size="16" class="" text-anchor="middle">GameCatalog</text>
<path d="M930 150 V1758" stroke="#94a3b8" stroke-dasharray="6 6"/>
<rect x="1032" y="87" width="176" height="63" fill="#f8fafc" stroke="#64748b" stroke-width="1.3" />
<text x="1120" y="113" font-size="16" class="" text-anchor="middle">factory :</text>
<text x="1120" y="137" font-size="16" class="" text-anchor="middle">IGameFactory</text>
<path d="M1120 150 V1758" stroke="#94a3b8" stroke-dasharray="6 6"/>
<rect x="1232" y="87" width="176" height="63" fill="#f8fafc" stroke="#64748b" stroke-width="1.3" />
<text x="1320" y="113" font-size="16" class="" text-anchor="middle">history :</text>
<text x="1320" y="137" font-size="16" class="" text-anchor="middle">CommandHistory</text>
<path d="M1320 150 V1758" stroke="#94a3b8" stroke-dasharray="6 6"/>
<rect x="1437" y="87" width="176" height="63" fill="#f8fafc" stroke="#64748b" stroke-width="1.3" />
<text x="1525" y="113" font-size="16" class="" text-anchor="middle">command :</text>
<text x="1525" y="137" font-size="16" class="" text-anchor="middle">IMoveCommand</text>
<path d="M1525 150 V1758" stroke="#94a3b8" stroke-dasharray="6 6"/>
<rect x="20" y="170" width="1600" height="430" fill="none" stroke="#64748b" stroke-width="1.3" />
<text x="35" y="197" font-size="18" class="" text-anchor="start">SAVE  |  initiated by Game.HandleControl after reading save path</text>
<polyline points="305,233 520,233" class="edge "/>
<text x="412.5" y="224" font-size="16" class="" text-anchor="middle">Save(game, path)</text>
<polyline points="520,274 305,274" class="edge "/>
<text x="412.5" y="265" font-size="16" class="" text-anchor="middle">ToSaveData()</text>
<polyline points="305,315 1320,315" class="edge "/>
<text x="812.5" y="306" font-size="16" class="" text-anchor="middle">Records()</text>
<polyline points="1320,356 305,356" class="edge dash"/>
<text x="812.5" y="347" font-size="16" class="" text-anchor="middle">applied MoveRecords, oldest first</text>
<rect x="95" y="377" width="395" height="64" fill="white" stroke="#64748b" stroke-width="1.3" />
<text x="105" y="400" font-size="15" class="" text-anchor="start">Game also calls Board.ToSnapshot()</text>
<text x="105" y="422" font-size="15" class="" text-anchor="start">and copies both player inventories.</text>
<polyline points="305,465 520,465" class="edge dash"/>
<text x="412.5" y="456" font-size="16" class="" text-anchor="middle">GameSaveData</text>
<polyline points="520,505 730,505" class="edge "/>
<text x="625.0" y="496" font-size="16" class="" text-anchor="middle">WriteAllText(temp, JSON)</text>
<polyline points="520,545 730,545" class="edge "/>
<text x="625.0" y="536" font-size="16" class="" text-anchor="middle">Move(temp, path, overwrite)</text>
<polyline points="520,586 305,586" class="edge dash"/>
<text x="412.5" y="577" font-size="16" class="" text-anchor="middle">saved</text>
<rect x="20" y="630" width="1600" height="1135" fill="none" stroke="#64748b" stroke-width="1.3" />
<text x="35" y="658" font-size="18" class="" text-anchor="start">LOAD  |  new menu load or GameOutcome.LoadRequested</text>
<polyline points="110,703 520,703" class="edge "/>
<text x="315.0" y="694" font-size="16" class="" text-anchor="middle">Load(path, catalog)</text>
<polyline points="520,745 730,745" class="edge "/>
<text x="625.0" y="736" font-size="16" class="" text-anchor="middle">ReadAllText(path)</text>
<polyline points="730,785 520,785" class="edge dash"/>
<text x="625.0" y="776" font-size="16" class="" text-anchor="middle">JSON</text>
<rect x="390" y="803" width="385" height="64" fill="white" stroke="#64748b" stroke-width="1.3" />
<text x="400" y="826" font-size="15" class="" text-anchor="start">RequireFields; Deserialize; ValidateData</text>
<text x="400" y="848" font-size="15" class="" text-anchor="start">Check schema, version, enums and records.</text>
<polyline points="520,895 930,895" class="edge "/>
<text x="725.0" y="886" font-size="16" class="" text-anchor="middle">Resolve(familyKey, variantKey)</text>
<polyline points="930,935 520,935" class="edge dash"/>
<text x="725.0" y="926" font-size="16" class="" text-anchor="middle">registered factory</text>
<polyline points="520,975 1120,975" class="edge "/>
<text x="820.0" y="966" font-size="16" class="" text-anchor="middle">CreateGame(GameSetup)</text>
<rect x="890" y="993" width="390" height="64" fill="white" stroke="#64748b" stroke-width="1.3" />
<text x="900" y="1016" font-size="15" class="" text-anchor="start">Create parts; Assemble fresh game.</text>
<text x="900" y="1038" font-size="15" class="" text-anchor="start">Reversi initialises the four centre disks.</text>
<polyline points="1120,1082 520,1082" class="edge dash"/>
<text x="820.0" y="1073" font-size="16" class="" text-anchor="middle">fresh game</text>
<polyline points="520,1122 305,1122" class="edge "/>
<text x="412.5" y="1113" font-size="16" class="" text-anchor="middle">AutoRedraw = false</text>
<rect x="245" y="1142" width="1358" height="353" fill="none" stroke="#64748b" stroke-width="1.3" stroke-dasharray="6 5"/>
<text x="257" y="1167" font-size="16" class="" text-anchor="start">loop  [each applied MoveRecord; reject if previous Result.IsOver]</text>
<polyline points="520,1208 305,1208" class="edge "/>
<text x="412.5" y="1199" font-size="16" class="" text-anchor="middle">Replay([record])</text>
<rect x="252" y="1225" width="335" height="42" fill="white" stroke="#64748b" stroke-width="1.3" />
<text x="262" y="1248" font-size="15" class="" text-anchor="start">Verify actor; Validate; CreateCommand.</text>
<polyline points="305,1284 1320,1284" class="edge "/>
<text x="812.5" y="1275" font-size="16" class="" text-anchor="middle">Do(command, State)</text>
<polyline points="1320,1324 1525,1324" class="edge "/>
<text x="1422.5" y="1315" font-size="16" class="" text-anchor="middle">Execute(State)</text>
<rect x="1090" y="1342" width="485" height="64" fill="white" stroke="#64748b" stroke-width="1.3" />
<text x="1100" y="1365" font-size="15" class="" text-anchor="start">Reversi command: record CellChanges; Board.Apply.</text>
<text x="1100" y="1387" font-size="15" class="" text-anchor="start">History: push undo, clear redo, MoveCount++.</text>
<rect x="252" y="1420" width="480" height="42" fill="white" stroke="#64748b" stroke-width="1.3" />
<text x="262" y="1443" font-size="15" class="" text-anchor="start">Game: OnMoveApplied; evaluate win; raise TurnChanged.</text>
<polyline points="305,1482 520,1482" class="edge dash"/>
<text x="412.5" y="1473" font-size="16" class="" text-anchor="middle">replayed</text>
<polyline points="520,1532 305,1532" class="edge "/>
<text x="412.5" y="1523" font-size="16" class="" text-anchor="middle">read board + inventories</text>
<polyline points="305,1572 520,1572" class="edge dash"/>
<text x="412.5" y="1563" font-size="16" class="" text-anchor="middle">reconstructed values</text>
<rect x="410" y="1590" width="535" height="64" fill="white" stroke="#64748b" stroke-width="1.3" />
<text x="420" y="1613" font-size="15" class="" text-anchor="start">Compare board and inventories with saved snapshots.</text>
<text x="420" y="1635" font-size="15" class="" text-anchor="start">Empty history: Replay(empty) evaluates the initial result.</text>
<polyline points="520,1678 305,1678" class="edge "/>
<text x="412.5" y="1669" font-size="16" class="" text-anchor="middle">restore redraw; Repository = this</text>
<polyline points="520,1720 110,1720" class="edge dash"/>
<text x="315.0" y="1711" font-size="16" class="" text-anchor="middle">verified game; undo stack ready</text>
<polyline points="110,1756 305,1756" class="edge "/>
<text x="207.5" y="1747" font-size="16" class="" text-anchor="middle">Play(io) if in progress</text>
<text x="35" y="1794" font-size="17" class="" text-anchor="start">Failure: MainMenu.TryLoad catches the error; the current game is retained. Internal calls are described in notes.</text>
<text x="35" y="1822" font-size="17" class="" text-anchor="start">Completed save: the menu renders its board and result, then returns without starting another turn.</text>
</svg>
